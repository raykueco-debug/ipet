<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfe6ff">
<title>狐火奔跑</title>
<style>
  :root { --ink: #4a3b33; --card: #fffdf8; --accent: #ff8a65; --glow: #ffb347; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6ff; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) 16px 0; pointer-events: none; font-weight: 800; }
  .orbs { background: #ffffffd9; border-radius: 999px; padding: 6px 14px; font-size: 20px; }
  .time { flex: 1; height: 12px; background: #ffffff99; border-radius: 99px; overflow: hidden; }
  .time i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ffd56b, #ff8a65); border-radius: 99px; }
  .boost { position: fixed; right: 16px; bottom: max(18px, env(safe-area-inset-bottom)); width: 92px; height: 92px;
    border-radius: 50%; border: 0; background: radial-gradient(circle at 40% 35%, #fff3c4, var(--glow) 60%, #ff7a3d);
    box-shadow: 0 6px 18px #ff7a3d66; font-size: 38px; color: #fff; font-weight: 900; }
  .boost:disabled { filter: grayscale(1) opacity(.5); }
  .boost b { position: absolute; left: 0; right: 0; bottom: -26px; font-size: 15px; color: var(--ink); text-shadow: 0 1px 0 #fff; }
  .card { position: fixed; inset: 0; display: grid; place-items: center; background: #0003; }
  .card[hidden] { display: none; }
  .card > div { background: var(--card); border-radius: 24px; padding: 26px 24px; width: min(88vw, 360px); text-align: center;
    box-shadow: 0 12px 40px #0003; }
  .card h1 { margin: 0 0 8px; font-size: 28px; }
  .card p { margin: 6px 0; color: #7a6a5e; line-height: 1.5; }
  .card .big { font-size: 40px; font-weight: 900; color: var(--accent); margin: 10px 0; }
  .card button { margin: 14px 6px 0; padding: 12px 22px; font-size: 18px; font-weight: 800; border: 0; border-radius: 999px;
    background: var(--accent); color: #fff; }
  .card button.ghost { background: #f1e7dc; color: var(--ink); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><span class="orbs">🎵 <span id="orbs">0</span></span><div class="time"><i id="timeBar"></i></div></div>
<button class="boost" id="boost" aria-label="加速">⚡<b id="boostLeft"></b></button>
<div class="card" id="start"><div>
  <h1>🦊 狐火奔跑</h1>
  <p>音樂會一直播，跟著節奏把旋律撿回來！</p>
  <p>🎵 吃：音符到腳下時在那條路上（點左右換路）</p>
  <p>⤴ 跳：大音符到時往上滑</p>
  <p>〰 連打：光帶經過時一直點</p>
  <p>⚡ 幾條尾巴就有幾次：3 秒內音符自己彈</p>
  <button id="go">開始！</button>
</div></div>
<div class="card" id="end" hidden><div>
  <h1>跑完了！</h1>
  <p>小狐彈了 <b id="piece"></b>，完成度</p><div class="big">🎵 <span id="final">0</span></div>
  <p id="endNote"></p>
  <button id="again">再跑一次</button><button class="ghost" id="home">回到小狐</button>
</div></div>
<script src="music.js"></script>
<script src="runner.js"></script>
</body>
</html>
